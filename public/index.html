<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Schmeckers</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Nunito:wght@600;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="hud">
    <h1>Schmeckers</h1>
    <p id="status-text">Connecting…</p>
    <p id="turn-text"></p>
    <div class="audio-controls">
      <button type="button" id="music-btn" class="audio-btn">Music: On</button>
      <button type="button" id="mute-btn" class="audio-btn">Sound: On</button>
    </div>
  </header>

  <main class="board-stage">
    <div class="board-frame">
      <img
        id="board-bg"
        class="board-bg"
        src="Shmeckers.jpg"
        alt="Schmeckers board"
        width="640"
        height="640"
      />
      <div id="chessboard" aria-label="Schmeckers board"></div>
    </div>
  </main>

  <p class="hint">Tap your piece, then tap a green square. Red moves first.</p>

  <script src="/socket.io/socket.io.js"></script>
  <script src="audio.js?v=1"></script>
  <script src="game.js?v=8"></script>
</body>
</html>
